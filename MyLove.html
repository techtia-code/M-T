<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Michael St Lloyd Wellington</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            animation: float 5s linear infinite;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .popup {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            z-index: 10;
            border: 2px solid #ffb6c1;
        }

        h1 { color: #d63384; font-size: 28px; }
        p { color: #555; line-height: 1.6; font-size: 18px; }
        
        /* Music Button Style */
        #play-btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        #play-btn:hover { background-color: #d63384; }

        /* Hiding the actual YouTube player */
        #youtube-player { display: none; }
    </style>
</head>
<body>

    <!-- Hidden YouTube Embed -->
    <iframe id="youtube-player" 
        src="https://www.youtube.com" 
        allow="autoplay">
    </iframe>

    <div class="popup">
        <h1>Happy Valentine's Day, Michael! ❤️</h1>
        <p>
            To <strong>Michael St Lloyd Wellington</strong>,<br><br>
            I love you more than words can say. You make everything shinier and my bad days better. 
            I'm so lucky to have you by my side.
        </p>
        <button id="play-btn">🎵 Play Our Song</button>
        <p class="signature">With all my love, always.</p>
    </div>

    <script>
        // Floating hearts logic
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 300);

        // Music play logic
        const btn = document.getElementById('play-btn');
        const player = document.getElementById('youtube-player');
        
        btn.addEventListener('click', () => {
            // Tells the YouTube iframe to start playing
            player.src += "&autoplay=1";
            btn.innerHTML = "🎶 Playing...";
            btn.style.opacity = "0.5";
            btn.disabled = true;
        });
    </script>
</body>
</html>
